<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Shield -->
  <rect width="512" height="512" rx="120" fill="url(#grad)"/>
  <circle cx="256" cy="256" r="220" stroke="#f59e0b" stroke-width="8" stroke-dasharray="16 12" fill="none" opacity="0.6"/>
  <!-- Mountain Peaks -->
  <polygon points="120,380 230,220 310,330 390,240 430,380" fill="#f59e0b" opacity="0.25"/>
  <polygon points="170,380 256,260 340,380" fill="#f59e0b" opacity="0.4"/>
  <!-- Head with Hat -->
  <circle cx="256" cy="150" r="32" fill="#fef3c7"/>
  <path d="M220,150 Q256,130 292,150 Q310,155 315,160 L197,160 Z" fill="#d97706"/>
  <!-- Torso & Backpack -->
  <path d="M240,190 L275,190 L285,280 L230,280 Z" fill="#fef3c7"/>
  <rect x="275" y="200" width="30" height="60" rx="8" fill="#ea580c"/>
  <!-- Walking Stick -->
  <line x1="210" y1="180" x2="190" y2="390" stroke="#f59e0b" stroke-width="10" stroke-linecap="round"/>
  <!-- Legs -->
  <path d="M240,280 L220,380 L200,380" stroke="#fef3c7" stroke-width="18" stroke-linecap="round" fill="none"/>
  <path d="M270,280 L295,350 L325,370" stroke="#fef3c7" stroke-width="18" stroke-linecap="round" fill="none"/>
  <!-- Ground Curve -->
  <path d="M80,390 Q256,360 432,390" stroke="#10b981" stroke-width="12" stroke-linecap="round" fill="none"/>
  <!-- SARTHI Text -->
  <text x="256" y="450" font-family="Cinzel, serif, Arial" font-size="52" font-weight="bold" fill="#fef3c7" text-anchor="middle" letter-spacing="8">SARTHI</text>
</svg>
